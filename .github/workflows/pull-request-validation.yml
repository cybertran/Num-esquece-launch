name: Public source validation

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: public-source-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Android SDK 36
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Verify F-Droid runtime is free of Google/Firebase dependencies
        run: |
          ./gradlew --no-daemon :app:dependencies --configuration fdroidReleaseRuntimeClasspath | tee fdroid-runtime.txt
          if grep -E "com\.google\.android\.gms|com\.google\.firebase" fdroid-runtime.txt; then
            echo "Forbidden proprietary dependency found in fdroidReleaseRuntimeClasspath"
            exit 1
          fi

      - name: Assemble source variants
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:assembleFdroidDebug \
            :app:assembleFdroidRelease \
            :app:assembleGoogleDebug \
            :app:assembleGoogleRelease

      - name: Verify expected outputs
        run: |
          test -f app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk
          test -f app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk
          test -f app/build/outputs/apk/google/debug/app-google-debug.apk
          test -f app/build/outputs/apk/google/release/app-google-release-unsigned.apk
