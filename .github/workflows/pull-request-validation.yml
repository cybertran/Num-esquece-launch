name: Public source validation

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-source-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Android SDK 36
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Source privacy gate
        shell: bash
        run: |
          set -euo pipefail

          if git grep -nI -E 'Google Drive|Google Account|GOOGLE_SYNC|googleSync|play-services-auth|com\.google\.android\.gms|com\.google\.firebase' -- app docs README.md; then
            echo "Remote sync or proprietary runtime integration found in the offline product."
            exit 1
          fi

          if git grep -nI -E 'android\.permission\.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|CAMERA|RECORD_AUDIO|READ_CALENDAR|WRITE_CALENDAR|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE|AD_ID)' -- app/src; then
            echo "Forbidden sensitive permission found in app sources."
            exit 1
          fi

      - name: Secret scan
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nI -E '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{30,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' -- .; then
            echo "Possible credential or private key found in tracked text."
            exit 1
          fi

      - name: F-Droid metadata consistency
        shell: bash
        run: |
          set -euo pipefail
          test -f .fdroid.yml

          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          metadata = Path(".fdroid.yml").read_text(encoding="utf-8")

          def field(name: str) -> str:
              match = re.search(rf"^\s*{re.escape(name)}:\s*['\"]?([^'\"\n]+)['\"]?\s*$", metadata, re.MULTILINE)
              if not match:
                  raise SystemExit(f"Missing F-Droid metadata field: {name}")
              return match.group(1).strip()

          version_name = field("versionName")
          version_code = int(field("versionCode"))
          commit = field("commit")
          current_version = field("CurrentVersion")
          current_version_code = int(field("CurrentVersionCode"))

          if version_name != current_version or version_code != current_version_code:
              raise SystemExit("F-Droid current version fields do not match the build entry.")

          subprocess.run(["git", "rev-parse", "--verify", f"{commit}^{{commit}}"], check=True, stdout=subprocess.DEVNULL)
          gradle = subprocess.check_output(["git", "show", f"{commit}:app/build.gradle.kts"], text=True)

          gradle_name = re.search(r'versionName\s*=\s*"([^"]+)"', gradle)
          gradle_code = re.search(r'versionCode\s*=\s*(\d+)', gradle)
          if not gradle_name or not gradle_code:
              raise SystemExit("Could not read version from tagged app/build.gradle.kts.")

          if gradle_name.group(1) != version_name or int(gradle_code.group(1)) != version_code:
              raise SystemExit("F-Droid metadata version does not match the tagged source.")

          if "gradle:\n      - fdroid" not in metadata:
              raise SystemExit("F-Droid build recipe must use the fdroid flavor.")

          if "Repo: https://github.com/cybertran/Num-esquece-launch.git" not in metadata:
              raise SystemExit("Unexpected F-Droid source repository.")

          print(f"F-Droid metadata matches {commit}: {version_name} ({version_code})")
          PY

      - name: F-Droid runtime dependency gate
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:dependencies --configuration fdroidReleaseRuntimeClasspath | tee fdroid-runtime.txt
          if grep -E 'com\.google\.android\.gms|com\.google\.firebase|firebase-analytics|play-services-ads' fdroid-runtime.txt; then
            echo "Forbidden proprietary or analytics dependency found in fdroidReleaseRuntimeClasspath."
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testFdroidDebugUnitTest

      - name: Lint F-Droid release
        run: ./gradlew --no-daemon --stacktrace :app:lintFdroidRelease

      - name: Assemble F-Droid variants
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:assembleFdroidDebug \
            :app:assembleFdroidRelease

      - name: APK privacy gate
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk"
          test -f "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump permissions "$APK" | tee apk-permissions.txt
          if grep -E 'android\.permission\.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|CAMERA|RECORD_AUDIO|READ_CALENDAR|WRITE_CALENDAR|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE|AD_ID)' apk-permissions.txt; then
            echo "Forbidden permission found in final APK."
            exit 1
          fi

      - name: Verify APK outputs
        run: |
          test -f app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk
          test -f app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk

  publish-source-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create v1.0.0 source release if missing
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = "v1.0.0";

            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.info("v1.0.0 release already exists; nothing to do.");
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const body = [
              "Primeira versão estável do Num esquece.",
              "",
              "Aplicativo Android offline para lembretes persistentes: o lembrete só termina quando você resolve o assunto.",
              "",
              "Privacidade: sem conta, anúncios, analytics, permissão de Internet ou backup automático em nuvem.",
              "",
              "Esta GitHub Release publica o código-fonte oficial da v1.0.0. O APK de teste usado na validação interna não é publicado aqui como artefato oficial, pois utiliza assinatura de desenvolvimento. A distribuição assinada segue o processo documentado para F-Droid/assinatura externa."
            ].join("\n");

            const response = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: "Num esquece v1.0.0",
              body,
              draft: false,
              prerelease: false
            });

            core.info(`Published ${response.data.html_url}`);
